name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # 本 job 只做 checkout / 类型检查 / 构建 / 内容校验，不需要任何写权限。
    # 不声明则沿用仓库默认（可能是 write-all）。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 单元测试直接 import src/lib 下的 .ts 文件，依赖 Node 原生的
          # TypeScript 类型剥离（22.18+ 默认开启）；用 24 与本地开发环境一致
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run validate
