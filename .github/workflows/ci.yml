name: CI

on:
  push:
    branches: [main]
  pull_request:

# 每日定时推送与手动修复推送可能时间接近，避免并行跑两份。
# PR 上取消进行中的旧运行（中间提交的结果无意义）；push 到 main 则排队而不取消，
# 因为 main 上的校验信号不应被丢弃。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # 本 job 只做 checkout / 类型检查 / 构建 / 内容校验，不需要任何写权限。
    # 不声明则沿用仓库默认（可能是 write-all）。
    permissions:
      contents: read
    steps:
      # actions 钉到 commit SHA 而非可变的 @v4 标签：标签可被上游强制移动，
      # 是供应链攻击面。升级由 dependabot 提议（见 .github/dependabot.yml）。
      # 注：checkout 与 setup-node 上游已发布 v7，本次只冻结当前 v4 行为，
      # 跨大版本升级是独立决策，不与加固混在一起。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 单元测试直接 import src/lib 下的 .ts 文件，依赖 Node 原生的
          # TypeScript 类型剥离（22.18+ 默认开启）；用 24 与本地开发环境一致
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run validate
